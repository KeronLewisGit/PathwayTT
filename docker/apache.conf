<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        # Laravel's public/.htaccess handles the front-controller rewrite,
        # exactly as it will on cPanel.
        AllowOverride All
        Require all granted
    </Directory>

    # Resumes live in storage/app/private and are only ever served through
    # the signed download route — nothing outside /public is reachable.
    <Directory /var/www/html>
        Require all denied
    </Directory>

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
