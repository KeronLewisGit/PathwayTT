; PathwayTT container PHP settings — mirrors the hand-made Laragon php.ini
; and what a shared host typically allows (resume uploads are capped at 5 MB
; by the app; give PHP headroom above that).
upload_max_filesize = 10M
post_max_size = 12M
memory_limit = 512M
max_execution_time = 120

; Timezone: the app stores UTC and displays AST (APP_DISPLAY_TIMEZONE).
date.timezone = UTC

; Opcache on, but validate timestamps so bind-mounted edits show up.
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
opcache.memory_consumption = 128

expose_php = Off
